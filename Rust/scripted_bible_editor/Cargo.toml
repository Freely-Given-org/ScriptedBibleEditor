[package]
name = "scripted_bible_editor"
version = "0.8.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
log = "0.4"
env_logger = "0.11"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
bos_books_codes = { path = "../../../BibleOrgSys/Rust/bos_books_codes" }
bible-transliterations = { path = "../../../BibleTransliterations/Rust" }
usfm_markers = { path = "../../../BibleOrgSys/Rust/usfm_markers" }
walkdir = "2.4"
fancy-regex = "0.13"
rayon = "1.12"
unicode-normalization = "0.1"
indexmap = { version = "2.7", features = ["serde"] }
